<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keycloak Demo App</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="top-bar">
        <div>
          <h1>Keycloak Demo App</h1>
          <p class="subtitle">Passkey and TUM Login</p>
        </div>
        <a
          id="admin-btn"
          class="admin-link-button"
          href="#"
          >Keycloak Admin</a
        >
      </header>

      <section class="panel login-window" id="login-window">
        <p class="status-line">Status: <strong id="auth-status" class="status-value" data-state="pending">checking...</strong></p>
        <h2>Sign In</h2>
        <p class="helper-text">Choose one of the two login options.</p>
        <div class="actions stacked">
          <button id="login-passkey-btn">Login with Passkey</button>
          <button id="login-tum-btn" class="secondary">Login with TUM Login</button>
        </div>
      </section>

      <section class="panel account-window" id="user-card" hidden>
        <div class="account-header">
          <h2>User Session</h2>
          <p class="status-line">Status: <strong id="auth-status-account" class="status-value" data-state="authenticated">authenticated</strong></p>
        </div>
        <div class="actions">
          <button id="create-passkey-btn">Create Passkey</button>
          <button id="logout-btn" class="danger">Logout</button>
        </div>
        <div class="passkey-manager">
          <div class="passkey-manager-header">
            <h3>Registered Passkeys</h3>
            <button id="refresh-passkeys-btn" class="secondary" type="button">Refresh</button>
          </div>
          <p id="passkey-feedback" class="helper-text" hidden></p>
          <p id="passkey-empty" class="helper-text">No passkeys registered yet.</p>
          <ul id="passkey-list" class="passkey-list"></ul>
        </div>
        <details id="user-info-toggle" class="user-data">
          <summary>Userinfo</summary>
          <pre id="user-info"></pre>
        </details>
      </section>
    </main>
  </body>
</html>
